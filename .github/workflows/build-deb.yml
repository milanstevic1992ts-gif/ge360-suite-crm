name: Build GE360 SuiteCRM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "UPSTREAM.lock"
      - "docker-compose.yml"
      - "docker/**"
      - ".dockerignore"
      - "scripts/**"
      - "config/**"
      - "packaging/**"
      - ".github/workflows/build-deb.yml"

jobs:
  validate-build-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh
          bash -n packaging/build-deb.sh

      - name: Validate Compose
        run: docker compose --env-file config/ge360.env.example config >/dev/null

      - name: Build SuiteCRM runtime image
        run: docker compose --env-file config/ge360.env.example build web

      - name: Build Debian package
        run: |
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Install Debian package
        run: sudo apt-get install -y ./dist/*.deb

      - name: Smoke test real installation
        run: |
          sudo ge360-suitecrm-install
          ge360-suitecrm-status
          ge360-suitecrm-doctor
          curl -fsS http://127.0.0.1:8791/ >/dev/null

      - name: Cleanup smoke test
        if: always()
        run: |
          if [ -f /etc/ge360/suitecrm-engine.env ]; then
            sudo ge360-suitecrm-uninstall --purge || true
          fi
          sudo rm -f /etc/ge360/suitecrm-engine.env || true

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: ge360-suitecrm-engine-deb
          path: dist/*.deb
          if-no-files-found: error
